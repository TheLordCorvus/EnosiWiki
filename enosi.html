<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enosi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050817;--panel:#0b1230;--edge:#5f8fd0;--fg:#e6f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050817;--panel:#0b1230;--edge:#5f8fd0;--fg:#e6f0ff}}
:root[data-theme="dark"]{--bg:#050817;--panel:#0b1230;--edge:#5f8fd0;--fg:#e6f0ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;max-width:100vw;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;max-width:100vw;touch-action:none}
img{max-width:100%}
#detail{overflow:hidden}
.detail-box{max-width:100%;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.detail-box::-webkit-scrollbar{width:10px}
.detail-box::-webkit-scrollbar-track{background:transparent}
.detail-box::-webkit-scrollbar-thumb{background:rgba(95,143,208,.45);border-radius:999px;border:2px solid rgba(11,18,48,.92)}
.detail-cols{min-width:0}
.detail-cols>*{min-width:0;max-width:100%}
.detail-main textarea,.field input,.detail-img-title input{max-width:100%}
#info{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,90vw);box-sizing:border-box;padding:12px 18px;text-align:center;background:rgba(11,18,48,.82);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(6px)}
body.wide #info{left:auto;right:24px;bottom:auto;top:50%;transform:translateY(-50%);width:min(320px,26vw)}
.art{margin-top:10px;width:100%;height:min(200px,22vh);border:1px dashed var(--edge);border-radius:10px;display:grid;place-items:center;overflow:hidden;cursor:pointer;box-sizing:border-box;font:500 15px/1.3 "Cormorant Garamond",Georgia,serif;color:#8fa8d0;background:rgba(95,143,208,.06)}
.art:has(img){border-style:solid}
.art img{width:100%;height:100%;object-fit:cover;display:block}
body:not(.editor) .art{cursor:default}
body.wide .art{height:auto;aspect-ratio:4/3}
#info .go{display:block;margin-top:6px;font-size:14px;font-style:italic;opacity:.75}
#info .backbtn{display:inline-block;margin-bottom:8px;padding:6px 12px;background:rgba(95,143,208,.15);color:var(--fg);border:1px solid var(--edge);border-radius:999px;font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;cursor:pointer}
#info .addbtn{display:inline-block;margin-bottom:8px;margin-left:6px;padding:6px 12px;background:rgba(61,220,107,.12);color:var(--fg);border:1px solid #3ddc6b;border-radius:999px;font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;cursor:pointer}
#info .delbtn{display:inline-block;margin-bottom:8px;margin-left:6px;padding:6px 12px;background:rgba(255,59,59,.12);color:var(--fg);border:1px solid #ff3b3b;border-radius:999px;font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;cursor:pointer}
#confirmbox{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:rgba(5,8,23,.78);backdrop-filter:blur(6px)}
#confirmbox[hidden]{display:none}
.confirm-box{width:min(380px,92vw);background:rgba(11,18,48,.95);border:1px solid var(--edge);border-radius:16px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;text-align:center}
.confirm-box h2{margin:0;font:700 16px Cinzel,Georgia,serif;letter-spacing:.06em}
.confirm-box p{margin:0;font:500 16px/1.45 "Cormorant Garamond",Georgia,serif}
#addbox{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:rgba(5,8,23,.78);backdrop-filter:blur(6px)}
#addbox[hidden]{display:none}
.add-form{width:min(380px,92vw);background:rgba(11,18,48,.95);border:1px solid var(--edge);border-radius:16px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.add-form h2{margin:0;font:700 16px Cinzel,Georgia,serif;letter-spacing:.06em}
.add-form label{font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;opacity:.85}
.add-form input[type=text]{width:100%;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font:500 15px "Cormorant Garamond",Georgia,serif;box-sizing:border-box}
.add-colors{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.add-sw{aspect-ratio:1;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.add-sw.on{border-color:#fff}
#info b{display:block;font:700 15px Cinzel,Georgia,serif;letter-spacing:.06em;margin-bottom:4px}
#info span{font:500 17px/1.35 "Cormorant Garamond",Georgia,serif}
#detail{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box;background:rgba(5,8,23,.78);backdrop-filter:blur(6px)}
#detail[hidden]{display:none}
#detail [hidden]{display:none!important}
.detail-main textarea[hidden],.detail-body[hidden]{display:none}
.detail-box{--glow:#fff;width:min(1200px,94vw);max-height:88vh;overflow-x:hidden;overflow-y:auto;background:rgba(11,18,48,.92);border:1px solid var(--glow);border-radius:16px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;position:relative;box-shadow:0 0 22px -4px var(--glow),0 0 60px -18px var(--glow);animation:detailPulse 3.2s ease-in-out infinite}
@keyframes detailPulse{0%,100%{box-shadow:0 0 18px -6px var(--glow),0 0 50px -20px var(--glow)}50%{box-shadow:0 0 28px -2px var(--glow),0 0 70px -14px var(--glow)}}
.detail-cols{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.detail-side{display:flex;flex-direction:column;gap:10px;min-width:0;background:rgba(5,8,23,.55);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;box-sizing:border-box}
@media(max-width:899px){#detail{flex-direction:column;overflow-y:auto;overflow-x:hidden}.detail-cols{grid-template-columns:1fr}}
.detail-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.detail-head h2{margin:0;font:700 19px Cinzel,Georgia,serif;letter-spacing:.06em}
.detail-img-title h3{margin:0 0 8px;font:700 19px Cinzel,Georgia,serif;letter-spacing:.05em;text-align:center}
.detail-img-title input{width:100%;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font:700 17px Cinzel,Georgia,serif;letter-spacing:.04em;text-align:center;box-sizing:border-box}
.detail-body{font:500 17px/1.5 "Cormorant Garamond",Georgia,serif;white-space:pre-wrap;overflow:visible}
.detail-body h2,.detail-body h3,.detail-body h4{font-family:Cinzel,Georgia,serif;margin:.6em 0 .3em;line-height:1.25}
.detail-body h2{font-size:19px;letter-spacing:.05em}
.detail-body h3{font-size:17px}
.detail-body h4{font-size:15px;opacity:.9}
.detail-body ul{margin:.4em 0 .4em 1.2em;padding:0}
.detail-body p{margin:.35em 0}
.detail-body hr{border:0;border-top:1px solid var(--edge);opacity:.6;margin:.7em 0}
.detail-body img{display:block;width:auto;height:auto;max-width:100%;max-height:min(200px,22vh);object-fit:contain;border-radius:10px;margin:.6em auto}
.detail-body img.img-L{float:left;margin:.3em .9em .4em 0}
.detail-body img.img-R{float:right;margin:.3em 0 .4em .9em}
.detail-body::after{content:'';display:block;clear:both}
.detail-body:empty::before{content:'Sin texto guardado.';opacity:.6;font-style:italic}
.detail-preview{border:1px dashed var(--edge);border-radius:10px;padding:10px 12px;max-height:30vh;overflow:auto;background:rgba(5,8,23,.5);font:500 16px/1.5 "Cormorant Garamond",Georgia,serif}
.detail-preview h2,.detail-preview h3,.detail-preview h4{font-family:Cinzel,Georgia,serif;margin:.5em 0 .25em}
.detail-body blockquote,.detail-preview blockquote{border-left:3px solid var(--edge);margin:.5em 0;padding:.2em 0 .2em .8em;opacity:.9;font-style:italic}
.detail-body table,.detail-preview table{border-collapse:collapse;margin:.5em 0;font-size:15px}
.detail-body th,.detail-body td,.detail-preview th,.detail-preview td{border:1px solid var(--edge);padding:4px 8px;text-align:left}
.detail-body a,.detail-preview a{color:#9dc0ff}
#storeMeter{font:500 12px "Cormorant Garamond",Georgia,serif;opacity:.75;align-self:center}
#detailSaved{color:#3ddc6b;font:700 13px Cinzel,Georgia,serif;align-self:center}
.detail-main textarea{width:100%;min-height:220px;resize:vertical;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font:500 16px/1.45 "Cormorant Garamond",Georgia,serif;box-sizing:border-box}
.detail-main textarea[hidden],.detail-body[hidden]{display:none}
.detail-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.detail-row button,.detail-head button{padding:8px 14px;background:rgba(95,143,208,.15);color:var(--fg);border:1px solid var(--edge);border-radius:999px;font:700 13px Cinzel,Georgia,serif;cursor:pointer}
#detailSaved{color:#3ddc6b;font:700 13px Cinzel,Georgia,serif;align-self:center;margin-right:auto}
.detail-fields{display:grid;gap:14px;margin-top:8px;text-align:left}
.field{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.field label{font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;opacity:.85;text-transform:none}
.field input{width:100%;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:6px 9px;font:500 14px/1.3 "Cormorant Garamond",Georgia,serif;box-sizing:border-box;text-transform:none}
.detail-fields-view{display:grid;gap:6px;margin-top:4px;text-align:left}
.frow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
.frow b{font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;opacity:.85;text-transform:none}
#detailBox[data-view="criaturas"] .frow span{font-size:12px}
.frow span{font:500 17px/1.4 "Cormorant Garamond",Georgia,serif;letter-spacing:0;opacity:1;text-transform:none}
@media(max-width:899px){#detail{flex-direction:column;overflow-y:auto;overflow-x:hidden}}
#authbox{position:fixed;top:14px;right:16px;z-index:60;display:flex;gap:8px;align-items:center;justify-content:flex-end;max-width:70vw}
#authbox .who{font:700 11px Cinzel,Georgia,serif;letter-spacing:.04em;color:#9fb4d8;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#authbtn,#pubb{font:700 11px Cinzel,Georgia,serif;letter-spacing:.06em;padding:7px 12px;color:var(--fg);background:rgba(11,18,48,.82);border:1px solid var(--edge);border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
#authbtn:hover,#pubb:hover{background:rgba(95,143,208,.22)}
#pubb{display:none;border-color:#3ddc6b}
body.editor #pubb{display:inline-block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="authbox"><span class="who" id="authwho"></span><button id="pubb" type="button" title="Sube tu copia local y sustituye lo publicado en la nube">Publicar todo</button><button id="authbtn" type="button">Entrar</button></div>
<div id="info"><b>Enosi</b><span>Toca una placa del caparazón para explorarla.</span></div>
<div id="detail" hidden><div class="detail-box" id="detailBox"><div class="detail-head"><h2 id="detailTitle">Radomir</h2><button id="detailEdit" type="button">Editar</button></div><div class="detail-cols"><div class="detail-main"><div class="detail-body" id="detailBody"></div><textarea id="detailText" placeholder="# Título&#10;**negrita** *cursiva* [enlace](https://…)&#10;> cita  | a | b |&#10;![t](img:ID|izq|50%)" hidden></textarea><div class="detail-preview" id="detailPreview" hidden></div></div><div class="detail-side"><div class="detail-img-title"><h3 id="headlineView"></h3><input id="f_headline" placeholder="Título superior" hidden></div><div class="art" id="detailArt"><span>Imagen<br>clic para añadir</span></div><button id="detailImgBtn" type="button">Añadir imagen</button><button id="detailImgPath" type="button" hidden>Usar ruta</button><button id="detailImgDel" type="button" hidden>Quitar imagen</button><div class="detail-fields" id="detailFields" hidden></div><div class="detail-fields-view" id="detailFieldsView"></div></div></div><div class="detail-row"><span id="detailSaved" hidden>Guardado ✓</span><span id="storeMeter"></span><button id="detailExport" type="button">Exportar</button><button id="detailImport" type="button">Importar</button><button id="detailImgInline" type="button" hidden>Imagen en texto</button><button id="detailSave" type="button" hidden>Guardar</button><button id="detailClose" type="button">Cerrar</button></div><input type="file" id="backupFile" accept="application/json" hidden><input type="file" id="inlineFile" accept="image/*" hidden></div></div>
<div id="addbox" hidden><div class="add-form"><h2>Nueva placa</h2><label>Nombre</label><input type="text" id="addName" maxlength="60" placeholder="Nombre del nodo"><label>Color</label><div class="add-colors" id="addColors"></div><label>O personalizado</label><input type="color" id="addCustom" value="#5f8fd0"><div class="detail-row"><button id="addCreate" type="button">Crear</button><button id="addCancel" type="button">Cancelar</button></div></div></div>
<div id="confirmbox" hidden><div class="confirm-box"><h2 id="confirmTitle">Eliminar</h2><p id="confirmMsg"></p><div class="detail-row" style="justify-content:center"><button id="confirmOk" type="button">Eliminar</button><button id="confirmNo" type="button">Cancelar</button></div></div></div>
