<!DOCTYPE html>

<head>

<style>
:root{--bg:#050817;--panel:#0b1230;--edge:#5f8fd0;--fg:#e6f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;max-width:100vw;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;max-width:100vw;touch-action:none}

#detail{overflow:hidden}

#addbox{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:rgba(5,8,23,.78);backdrop-filter:blur(6px)}

.detail-box{--glow:#fff;width:min(1200px,94vw);max-height:88vh;overflow-x:hidden;overflow-y:auto;background:rgba(11,18,48,.92);border:1px solid var(--glow);border-radius:16px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;position:relative;box-shadow:0 0 22px -4px var(--glow),0 0 60px -18px var(--glow);animation:detailPulse 3.2s ease-in-out infinite}

.detail-body:empty::before{content:'Sin texto guardado.';opacity:.6;font-style:italic}
.detail-preview{border:1px dashed var(--edge);border-radius:10px;padding:10px 12px;max-height:30vh;overflow:auto;background:rgba(5,8,23,.5);font:500 16px/1.5 "Cormorant Garamond",Georgia,serif}

.detail-body table,.detail-preview table{border-collapse:collapse;margin:.5em 0;font-size:15px}
.detail-body th,.detail-body td,.detail-preview th,.detail-preview td{border:1px solid var(--edge);padding:4px 8px;text-align:left}
.detail-body a,.detail-preview a{color:#9dc0ff}
#storeMeter{font:500 12px "Cormorant Garamond",Georgia,serif;opacity:.75;align-self:center}
#detailSaved{color:#3ddc6b;font:700 13px Cinzel,Georgia,serif;align-self:center}
.detail-main textarea{width:100%;min-height:220px;resize:vertical;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font:500 16px/1.45 "Cormorant Garamond",Georgia,serif;box-sizing:border-box}
.detail-main textarea[hidden],.detail-body[hidden]{display:none}
.detail-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.field{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}

.field input{width:100%;background:#070d26;color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:6px 9px;font:500 14px/1.3 "Cormorant Garamond",Georgia,serif;box-sizing:border-box;text-transform:none}
.detail-fields-view{display:grid;gap:6px;margin-top:4px;text-align:left}
.frow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
.frow b{font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;opacity:.85;text-transform:none}

.frow span{font:500 17px/1.4 "Cormorant Garamond",Georgia,serif;letter-spacing:0;opacity:1;text-transform:none}
@media(max-width:899px){#detail{flex-direction:column;overflow-y:auto;overflow-x:hidden}}
#authbox{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:4;display:flex;gap:8px;align-items:center;justify-content:flex-end;max-width:70vw}
#authbox .who{font:700 11px Cinzel,Georgia,serif;letter-spacing:.04em;color:#9fb4d8;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#authbtn{font:700 11px Cinzel,Georgia,serif;letter-spacing:.06em;padding:7px 12px;color:var(--fg);background:rgba(11,18,48,.82);border:1px solid var(--edge);border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}

#cloudNotice{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;max-width:min(540px,92vw);padding:9px 10px 9px 14px;background:rgba(11,18,48,.97);border:1px solid #3ddc6b;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:700 12px Cinzel,Georgia,serif;letter-spacing:.03em;color:var(--fg)}

#cloudNoticeOk{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid #3ddc6b;background:rgba(61,220,107,.14);color:var(--fg);font:700 11px Cinzel,Georgia,serif;cursor:pointer}
#cloudNoticeOk:hover{background:rgba(61,220,107,.28)}
@media(max-width:600px){#cloudNotice{top:calc(56px + env(safe-area-inset-top,0px));width:calc(100vw - 20px);border-radius:14px;justify-content:space-between}}
#zoombox{display:none}
@media(max-width:899px){
 #zoombox{display:flex;position:fixed;left:10px;top:38%;transform:translateY(-50%);z-index:4;flex-direction:column;gap:8px}
 #zoombox button{width:38px;height:38px;padding:0;border-radius:50%;background:rgba(11,18,48,.82);color:var(--fg);border:1px solid var(--edge);font:700 18px/1 Cinzel,Georgia,serif;cursor:pointer;backdrop-filter:blur(6px)}
 #zoombox button:active{background:rgba(95,143,208,.3)}
 #zoombox button.small{font-size:10px;letter-spacing:.04em}
 #info{max-height:44vh;overflow-y:auto}
 .field input,.detail-img-title input,.detail-quote input,.add-form input[type=text]{font-size:16px}
}
#searchbtn{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:4;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(11,18,48,.82);color:var(--fg);border:1px solid var(--edge);cursor:pointer;backdrop-filter:blur(6px)}

#detailSearch{padding:8px 10px!important;font-size:17px;line-height:1;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center}

.search-box{width:min(600px,94vw);max-height:min(82vh,720px);display:flex;flex-direction:column;background:rgba(11,18,48,.97);border:1px solid var(--edge);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}

.search-name{display:block;font:700 15px Cinzel,Georgia,serif;letter-spacing:.04em;margin-bottom:4px}

mark.srchit{background:rgba(95,143,208,.42);color:#fff;border-radius:3px;padding:0 1px}

 #searchbox{align-items:flex-start;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}

</head>
<body>
<canvas id="c"></canvas>
<div id="authbox"><span class="who" id="authwho"></span><button id="authbtn" type="button">Entrar</button></div>
<div id="cloudNotice" hidden role="status" aria-live="polite"><span>Hay nuevos cambios publicados. Cuando termines, reinicia la página para verlos.</span><button id="cloudNoticeOk" type="button">OK</button></div>
<div id="zoombox"><button id="zin" type="button" aria-label="Acercar">+</button><button id="zout" type="button" aria-label="Alejar">−</button><button id="zfit" type="button" class="small" aria-label="Ver todo">TODO</button></div>
<button id="searchbtn" type="button" aria-label="Buscar en la wiki" title="Buscar (Ctrl/Cmd+K)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path></svg></button>
<div id="info"><b>Enosi</b><span>Toca una placa del caparazón para explorarla.</span></div>
<div id="detail" hidden><div class="detail-box" id="detailBox"><div class="detail-head"><h2 id="detailTitle">Radomir</h2><div class="detail-actions"><button id="detailSearch" type="button" aria-label="Buscar en la wiki" title="Buscar (Ctrl/Cmd+K)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path></svg></button><button id="detailEdit" type="button">Editar</button><button id="detailX" type="button" aria-label="Cerrar">×</button></div></div><div class="detail-cols"><div class="detail-main"><div class="detail-body" id="detailBody"></div><textarea id="detailText" placeholder="# Título&#10;**negrita** *cursiva* [enlace](https://…)&#10;> cita  | a | b |&#10;![t](img:ID|izq|50%)" hidden></textarea><div class="detail-preview" id="detailPreview" hidden></div></div><div class="detail-side"><div class="detail-img-title"><h3 id="headlineView"></h3><input id="f_headline" placeholder="Título superior" hidden></div><div class="detail-quote" id="quoteField" hidden><label for="f_citado">Citado</label><input id="f_citado" type="text" placeholder="Frase al pasar el cursor" autocomplete="off"></div><div class="art" id="detailArt"><span>Imagen<br>clic para añadir</span></div><button id="detailImgBtn" type="button">Añadir imagen</button><button id="detailImgPath" type="button" hidden>Usar ruta</button><button id="detailImgDel" type="button" hidden>Quitar imagen</button><div class="detail-fields" id="detailFields" hidden></div><div class="detail-fields-view" id="detailFieldsView"></div></div></div><div class="detail-row"><span id="detailSaved" hidden>Guardado ✓</span><span id="storeMeter"></span><button id="detailExport" type="button">Exportar</button><button id="detailImport" type="button">Importar</button><button id="detailImgInline" type="button" hidden>Imagen en texto</button><button id="detailSave" type="button" hidden title="Guarda en este navegador y publica solo los cambios de esta ficha">Guardar y publicar</button><button id="detailClose" type="button">Cerrar</button></div><input type="file" id="backupFile" accept="application/json" hidden><input type="file" id="inlineFile" accept="image/*" hidden></div></div>

    if(!(k in d))return v!==null&&enviados[k]!==null;
    return d[k]!==v&&d[k]!==enviados[k];
   });
   if(ajenos)avisoNube();
  },e=>console.warn('No se pudo vigilar la nube:',e));
 }
 function ui(u){const b=document.getElementById('authbtn'),w=document.getElementById('authwho');if(!b)return;b.textContent=u?'Salir':'Entrar';w.textContent=u?(u.displayName||u.email||''):'';w.title=u?(u.email||''):''}
 async function revisar(u){
  editor=false;if(typeof setEditor==='function')setEditor(false);
  if(!u){ui(null);return}
  ui(u);
  try{await cargaP;const s=await db.doc('editors/'+u.uid).get();editor=s.exists}catch(e){editor=false}
  if(typeof setEditor==='function')setEditor(editor);
  if(!editor&&!avisado){avisado=true;alert('Tu cuenta no tiene permisos de edición.\n\nUID: '+u.uid+'\n\nPide que añadan ese UID a la colección "editors" de Firestore.')}
  if(editor&&Object.keys(pend).length)flush();
  ui(u);
 }
 cargaP.then(()=>iniciarVigilancia(),()=>iniciarVigilancia());
 auth.onAuthStateChanged(revisar);
 document.getElementById('authbtn').addEventListener('click',()=>{if(auth.currentUser){auth.signOut()}else{const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(e=>alert('No se pudo iniciar sesión: '+e.message))}});
 document.getElementById('cloudNoticeOk').addEventListener('click',()=>{const el=document.getElementById('cloudNotice');if(el)el.hidden=true});
 window.NUBE={guardar,borrar,syncable,subirImagen,flush,activo:()=>ready&&editor};
})();
</script>
