<button id="btnLogin">Entrar con Google</button>
<button id="btnLogout" style="display:none">Salir</button>
<span id="userInfo"></span>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = { /* tu config */ };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  btnLogin.onclick = () => signInWithPopup(auth, provider).catch(e => alert(e.code));
  btnLogout.onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    btnLogin.style.display = user ? "none" : "";
    btnLogout.style.display = user ? "" : "none";
    userInfo.textContent = user ? `${user.displayName} · UID: ${user.uid}` : "";
    if (user) console.log("UID:", user.uid);
  });
</script>
